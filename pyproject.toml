[project]
name = "concordance"
version = "0.1.0"
description = "Multi-engine backtester: a result counts only when independent engines agree."
requires-python = ">=3.13,<3.14"
dependencies = [
    "vectorbt[rust]==1.1.2",
    "nautilus_trader==1.231.0",
    "exchange_calendars",
    "duckdb",
    "polars",
    "pyarrow",
    "numpy",
    "pandas",
    "scipy",
    "skfolio",
    "optuna",
    "quantstats",
]

[project.scripts]
concordance = "concordance.cli:main"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concordance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["hft"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
